name: CI

on:
  push:
  pull_request:

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/data-integrity/ tests/data-model/

  content-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/content-production/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e

  # Phase 8A: dependency/security audit as a required, blocking gate — see
  # docs/engineering/CI-HARDENING.md for the severity-threshold rationale
  # (moderate: fails on real moderate/high/critical advisories anywhere in
  # the tree, without flapping CI on low/info noise in transitive
  # dev-only tooling). A separate job (not folded into `frontend`) so an
  # audit failure shows as its own unambiguous red status, not buried
  # inside a broader job's log.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # Phase 8A: the existing Chromium-only visual-regression suite
  # (playwright.visual.config.ts), now CI-enforced. Reuses the same
  # committed baselines, config, and `npm run test:visual` script that
  # already run locally — no new visual-testing system. See
  # docs/engineering/CI-HARDENING.md for the platform/baseline-stability
  # caveat this job depends on.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
